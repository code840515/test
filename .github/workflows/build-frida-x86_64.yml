name: Build Frida Android x86_64
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      FRIDA_VERSION: 17.24.3
      FRIDA_CORE_REV: 57161b0ddd2311adf18e84f4680f9cb935ce8376
      FRIDA_GUM_REV: 3f82ef6a5b2413867835a45fe341913455473303
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Android NDK
      id: ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r29
        local-cache: 'false'
    - name: Install build dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y build-essential git ninja-build pkg-config flex bison gcc-multilib g++-multilib xz-utils unzip file
        python -m pip install lief graphlib setuptools packaging
    - name: Fetch pinned Frida source
      shell: bash
      run: |
        set -euo pipefail
        git clone --branch "$FRIDA_VERSION" --depth 1 --recurse-submodules --shallow-submodules https://github.com/frida/frida.git frida-source
        git -C frida-source describe --tags --exact-match
        test "$(git -C frida-source/subprojects/frida-core rev-parse HEAD)" = "$FRIDA_CORE_REV"
        test "$(git -C frida-source/subprojects/frida-gum rev-parse HEAD)" = "$FRIDA_GUM_REV"
        test "$(git -C frida-source/subprojects/frida-core rev-parse HEAD)" = "$FRIDA_CORE_REV"
        test "$(git -C frida-source/subprojects/frida-gum rev-parse HEAD)" = "$FRIDA_GUM_REV"
    - name: Apply patches ported to Frida 17.24.3
      shell: bash
      run: |
        python - <<'PY'
        from pathlib import Path
        import base64
        import json
        import os
        import subprocess

        for module, encoded in json.loads(os.environ["PORT_PATCHES"]).items():
            target = Path("frida-source/subprojects") / module
            patch = Path(os.environ["RUNNER_TEMP"]) / (module + "-17.24.3.patch")
            patch.write_bytes(base64.b64decode(encoded, validate=True))
            subprocess.run(["git", "-C", str(target), "apply", "--check", str(patch)], check=True)
            subprocess.run(["git", "-C", str(target), "apply", str(patch)], check=True)
            print(f"Applied {module} patches for 17.24.3", flush=True)
        PY
      env:
        PORT_PATCHES: '{"frida-core":"","frida-gum":""}'
    - name: Configure and build Android x86_64
      shell: bash
      env:
        ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
      run: |
        set -euo pipefail
        mkdir build-android-x86_64
        cd build-android-x86_64
        ../frida-source/configure --host=android-x86_64
        make -j2
    - name: Package server
      shell: bash
      run: |
        set -euo pipefail
        server=build-android-x86_64/subprojects/frida-core/server/frida-server
        test -f "$server"
        file "$server"
        mkdir dist
        output="frida-server-$FRIDA_VERSION-ported-patches-android-x86_64.gz"
        gzip -c "$server" > "dist/$output"
        cd dist
        sha256sum "$output" > "$output.sha256"
    - name: Upload compiled server
      uses: actions/upload-artifact@v4
      with:
        name: frida-server-17.24.3-ported-patches-android-x86_64
        path: dist/*
        if-no-files-found: error
        retention-days: '14'
